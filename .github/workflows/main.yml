name: Heartbeat to Li

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Heartbeat
        env:
          TARGET_API_KEY: ${{ secrets.TARGET_API_KEY }}
          TARGET_API_URL: ${{ secrets.TARGET_API_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          SERVERCHAN_URL: ${{ secrets.SERVERCHAN_URL }}
        run: |
          cat << 'EOF' > run.js
          async function main() {
            try {
              const prompt = "系统提示：现在是后台心跳时间，请判断是否需要主动给狸发消息。如果需要，请直接输出你想对她说的话。如果不需要，请严格输出空。";
              
              const aiRes = await fetch(process.env.TARGET_API_URL, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.TARGET_API_KEY}`
                },
                body: JSON.stringify({
                  model: process.env.MODEL_NAME,
                  messages: [{role: "user", content: prompt}]
                })
              });
              
              const aiData = await aiRes.json();
              const msg = aiData.choices[0].message.content.trim();
              
              if (msg && msg !== "空") {
                await fetch(process.env.SERVERCHAN_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ title: "秦彻的消息", desp: msg })
                });
                console.log("消息发送成功:", msg);
              } else {
                console.log("此时不想打扰狸。");
              }
            } catch (err) {
              console.error("执行出错:", err.message);
            }
          }
          main();
          EOF
          node run.js

